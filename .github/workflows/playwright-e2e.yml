name: Playwright End To End (e2e) Tests Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Using the latest value doesn't work for now.
          # See https://github.com/peaceiris/actions-hugo/issues/652#issuecomment-2543985304
          # and https://github.com/peaceiris/actions-hugo/issues/662
          hugo-version: '0.165.0'
          extended: true

      - name: Hugo build
        run: hugo --gc --config ./config.toml -b http://127.0.0.1:1313

      - name: Run server
        run: |
          cd public && python -m http.server 1313 &

      - name: Test hugo endpoint
        run: |
          curl -sf http://127.0.0.1:1313 > /dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: playwright/ci-test/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwright/ci-test/package-lock.json') }}

      - name: Install npm dependencies
        working-directory: playwright/ci-test
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: playwright/ci-test
        run: npx playwright install --with-deps

      - name: Install Playwright system deps (when cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: playwright/ci-test
        run: npx playwright install-deps

      - name: Run Playwright tests
        working-directory: playwright/ci-test
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright/ci-test/playwright-report/
          retention-days: 30
