# This workflow updates the feeds, members list, and contributors stats.
# Each script runs in its own job, so one failing source does not hold back the others.

name: ⚒️ Scrape and commit
on:
  schedule:
    - cron:  '0 0,12 * * *'  # At midnight & noon UTC
  workflow_dispatch:   # Allows you to run this workflow manually from the Actions tab

jobs:
  scrape:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.repository_owner == 'qgis'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: '🗞️ Fetch Feed Content'
            id: feeds
            script: ./fetch_feeds.py
            paths: content/funders data/feed.json
          - name: '⚙️ Update Hub Maps'
            id: hub-images
            script: ./scripts/hub_images_harvest.py
            paths: content/hub-maps content/hub-screenshots
          - name: '📰 Fetch Grant Programme Posts'
            id: grants
            script: ./scripts/fetch_grants.py
            paths: content/community/organisation/grants
          - name: '🏢 Update Contributing Organizations'
            id: contributing-orgs
            script: ./scripts/update_contributing_orgs.py
            paths: data/contributors/organizations.json
          - name: '🧑‍💻 Update GitHub Contributors'
            id: individual-contributors
            script: ./scripts/update_individual_contributors.py
            paths: data/contributors/contributors.json static/data/contributors/contributors_map.json
    steps:
    - name: '🛒 Checkout QGIS Website'
      uses: actions/checkout@v7
      with:
        ref: main
        path: ./qgis-website
        submodules: recursive

    - name: '🐍 Setup Python'
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        architecture: 'x64'
        cache: "pipenv"

    - name: '🚸Install Python deps'
      run: |
        cd ./qgis-website
        pip install pipenv && pipenv install -r REQUIREMENTS.txt && pipenv sync --bare
        pipenv run pip freeze

    - name: '▶️ Run the script'
      env:
        SCRIPT: ${{ matrix.script }}
      run: |
        cd ./qgis-website
        pipenv run "$SCRIPT"

    - name: '📦 Save the changes as a patch'
      env:
        PATCH: ${{ matrix.id }}.patch
        OUTPUT_PATHS: ${{ matrix.paths }}
      run: |
        cd ./qgis-website
        git add -A -- $OUTPUT_PATHS
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git diff --cached --binary > "../$PATCH"
        fi

    - name: '⬆️ Upload the patch'
      uses: actions/upload-artifact@v7
      with:
        name: patch-${{ matrix.id }}
        path: ${{ matrix.id }}.patch
        if-no-files-found: ignore
        retention-days: 3

  commit:
    name: '✉️ Commit'
    needs: scrape
    runs-on: ubuntu-latest
    # Run even when some scrapers failed, so the ones that succeeded still land.
    if: ${{ !cancelled() && github.repository_owner == 'qgis' }}
    steps:
    - name: '🛒 Checkout QGIS Website'
      uses: actions/checkout@v7
      with:
        ref: main
        path: ./qgis-website

    - name: '⬇️ Download the patches'
      uses: actions/download-artifact@v8
      with:
        pattern: patch-*
        path: ./patches
        merge-multiple: true

    - name: '🩹 Apply the patches'
      run: |
        cd ./qgis-website
        shopt -s nullglob
        for patch in ../patches/*.patch; do
          echo "Applying $patch"
          git apply "$patch"
        done

    - name: '⬇️ Pull latest changes before commit'
      run: |
        cd ./qgis-website
        # Another scheduled job may have pushed to main while this one ran.
        # Rebase on top of it first (autostash tucks the generated files
        # aside) so the commit below is a fast forward.
        git pull --rebase --autostash origin main

    - name: '✉️ Commit'
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: 'Funders scraped and committed via a GitHub Action.'
        repository: ./qgis-website
