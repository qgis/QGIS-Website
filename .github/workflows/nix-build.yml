# Workflow to build the Nix package.
#
# The Cachix push step was removed when this site was forked from QGIS-Hugo:
# it pushed to the QGIS-owned `qgiswebsite` cache. Re-add a cachix-action step
# here once an OSGeo-owned cache and CACHIX_AUTH_TOKEN secret exist.
name: 🛫 Build with Nix

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
  
    - name: Run flake checks
      run: nix flake check

    - name: Build with Nix
      run: nix build .#website
